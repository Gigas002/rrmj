name: fmt and clippy

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        args:
          - --workspace --all-features
          - --workspace --no-default-features
          # Workspace builds unify librrmj's features with rrmj's (ai, serde),
          # so the minimal library is only checked on its own.
          - -p librrmj --no-default-features

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}
      - name: Clippy (${{ matrix.args }})
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings
